<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: clip; }
  body { overflow-x: hidden; max-width: 100%; }
  .main { max-width: 100%; }

  /* ── Theme variables (Q2 = blue, Q3 = deep green) ─────────── */
  :root {
    --bg-body: #0f172a;
    --bg-header: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    --header-border: #334155;
    --bg-card: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    --card-border: #334155;
    --tab-bg: #1e293b;
    --tab-border: #334155;
    --tab-active-bg: #0f172a;
    --tab-active-color: #38bdf8;
    --bar-track: #1e3a5f;
    --card-divider: #1e3a5f;
    --section-bg: #111827;
    --section-border: #1e3a5f;
    --chart-bg: #0a1222;
    --chart-border: #1e293b;
    --select-bg: #0f172a;
    --select-border: #334155;
    --snap-bg: linear-gradient(135deg, #111827 0%, #0f172a 100%);
    --snap-border: #1e3a5f;
    --progress-track: rgba(30,58,95,0.6);
    --progress-fill: linear-gradient(90deg,#6366f1,#38bdf8);
    --progress-glow: rgba(56,189,248,0.4);
    --progress-pct-color: #38bdf8;
  }
  body.q3-mode {
    --bg-body: #071510;
    --bg-header: linear-gradient(135deg, #0d2018 0%, #071510 100%);
    --header-border: #1a3a22;
    --bg-card: linear-gradient(135deg, #0d1f14 0%, #0a1810 100%);
    --card-border: #1a3520;
    --tab-bg: #0d1f14;
    --tab-border: #1a3a22;
    --tab-active-bg: #061209;
    --tab-active-color: #4ade80;
    --bar-track: #132a1a;
    --card-divider: #1a3520;
    --section-bg: #0a1c12;
    --section-border: #1a3a22;
    --chart-bg: #061209;
    --chart-border: #1a3520;
    --select-bg: #071510;
    --select-border: #1a3a22;
    --snap-bg: linear-gradient(135deg, #0a1c12 0%, #071510 100%);
    --snap-border: #1a3520;
    --progress-track: rgba(20,60,30,0.6);
    --progress-fill: linear-gradient(90deg,#16a34a,#4ade80);
    --progress-glow: rgba(74,222,128,0.4);
    --progress-pct-color: #4ade80;
  }

  body { background: var(--bg-body); color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* Header */
  .header { background: var(--bg-header); border-bottom: 1px solid var(--header-border); padding: 24px 32px; display: flex; align-items: center; justify-content: space-between; }
  .header-left h1 { font-size: 1.6rem; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em; }
  .header-left h1 span { color: #38bdf8; }
  .header-left .subtitle { color: #94a3b8; font-size: 0.85rem; margin-top: 3px; }
  .header-right .date-badge { background: var(--chart-bg); border: 1px solid var(--header-border); border-radius: 8px; padding: 6px 14px; font-size: 0.85rem; color: #94a3b8; }

  /* Legend */
  .legend-bar { padding: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-text { font-size: 0.72rem; color: #94a3b8; }

  /* Main content */
  .main { padding: 28px 32px; max-width: 1600px; margin: 0 auto; }

  /* Section headers */
  .section-header { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #a0b0c0; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--card-divider); }

  /* Team overview grid */
  .team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-bottom: 36px; align-items: stretch; }
  .rep-card { background: var(--bg-card); border: none; border-radius: 12px; padding: 14px; cursor: pointer; transition: all 0.15s; position: relative; overflow: visible; display: flex; flex-direction: column; }
  /* Gradient border: 4 color bands aligned to card sections */
  .rep-card::before { content: ''; position: absolute; inset: -3px; border-radius: 15px; padding: 3px; background: linear-gradient(to bottom, var(--vol-color, #334155) 0% 35%, var(--gl-color, #334155) 38% 60%, var(--avg-color, #334155) 63% 76%, var(--ote-color, #334155) 80% 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: destination-out; mask-composite: exclude; pointer-events: none; }
  .rep-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  .rep-card.active { outline: none; box-shadow: none; }
  .rep-card.active::before { display: block !important; }
  .rep-card .rep-name { font-size: 1.2rem; font-weight: 700; color: #f8fafc; margin-bottom: 0; transition: font-size 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  .rep-card.active .rep-name { font-size: 1.26rem; }
  .rep-card .metric-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .rep-card .metric-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; }
  .rep-card .pacing-badge { font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: white; }
  .rep-card { border: 1px solid var(--card-border); }
  .rep-card::before { display: none; }
  .rep-card.active { border: none !important; }
  .rep-card.rank-1 { border: 2px solid #fbbf24; box-shadow: 0 0 8px rgba(251,191,36,0.25); }
  .rep-card.rank-2 { border: 2px solid #9ca3af; box-shadow: 0 0 6px rgba(156,163,175,0.2); }
  .rep-card.rank-3 { border: 2px solid #b45309; box-shadow: 0 0 6px rgba(180,83,9,0.25); }
  .rep-card.ss-tile { cursor: pointer; background: linear-gradient(135deg, #2a1a5e 0%, #3b2480 100%); }
  .rep-card.cc-tile { cursor: pointer; background: linear-gradient(135deg, #4a1e2a 0%, #6b2d3e 100%); }
  .rep-card.cm-tile { cursor: pointer; background: linear-gradient(135deg, #0d3a6e 0%, #1a5490 100%); }

  /* Summary tile — The Plastics */
  .summary-tile { border-radius: 12px; padding: 20px; position: relative; overflow: hidden; cursor: default; }
  .summary-tile .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; border-radius: 12px 12px 0 0; }
  .summary-tile .tile-label { font-size: 1rem; font-weight: 700; color: #f8fafc; margin-bottom: 2px; }
  .summary-tile .tile-sub { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
  .summary-tile .metric-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .summary-tile .metric-label { font-size: 0.7rem; color: #a0b0c0; text-transform: uppercase; letter-spacing: 0.04em; }
  .summary-tile .pacing-badge { font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: white; }
  .summary-tile .tile-footer { margin-top: 10px; font-size: 0.7rem; color: #8896a7; }
  .summary-tile .tile-footer span { color: #a0b0c0; }

  .summary-tile.spec-squad-tile { background: linear-gradient(135deg, #0c1a2e 0%, #0f172a 100%); border: 2px solid #38bdf8; box-shadow: 0 0 0 1px rgba(56,189,248,0.15); }
  .summary-tile.spec-squad-tile .tile-sub { color: #38bdf8; }

  .summary-tile.clin-med-tile { background: linear-gradient(135deg, #071a14 0%, #0f172a 100%); border: 2px solid #10b981; box-shadow: 0 0 0 1px rgba(16,185,129,0.15); }
  .summary-tile.clin-med-tile .tile-sub { color: #10b981; }
  .summary-tile.clin-med-tile .metric-value { font-size: 0.9rem; font-weight: 700; color: #d1fae5; }
  .summary-tile.clin-med-tile .metric-note { font-size: 0.68rem; color: #8896a7; margin-top: 2px; }

  /* Rep detail section */
  .rep-detail { margin-top: 0; }
  .rep-section { background: var(--section-bg); border: 1px solid var(--section-border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .rep-section-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--section-border); }
  .rep-section-header .rep-title { font-size: 1.32rem; font-weight: 700; color: #f8fafc; transition: font-size 0.3s cubic-bezier(0.34,1.56,0.64,1), letter-spacing 0.3s ease; }
  .rep-section.rep-active .rep-title { font-size: 1.452rem; letter-spacing: 0.01em; }
  @keyframes titlePop { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
  .rep-section.rep-active .rep-title { }
  .rep-section-header .badges { display: flex; gap: 0; align-items: center; justify-content: flex-end; }
  .rep-section-header .badge-label { margin: 0 6px 0 18px; }
  .rep-section-header .badge-grp:first-child .badge-label { margin-left: 0; }
  .badge-grp { display: inline-flex; align-items: center; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; color: white; }
  .badge-label { font-size: 0.7rem; color: #a0b0c0; }
  .charts-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .chart-box { background: var(--chart-bg); border: 1px solid var(--chart-border); border-radius: 8px; padding: 14px; }
  .chart-box .chart-title { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #a0b0c0; margin-bottom: 10px; }
  .chart-box canvas { width: 100% !important; height: 250px !important; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { background: var(--tab-bg); border: 1px solid var(--tab-border); color: #94a3b8; padding: 7px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: font-size 0.3s cubic-bezier(0.34,1.56,0.64,1), color 0.15s, border-color 0.15s, background 0.3s; position: relative; overflow: visible; min-width:4.95rem; text-align:center; }
  .tab-btn.active { font-size: 0.86rem; }
  .tab-btn.team-tab { min-width:7.6rem; border: 2px solid var(--tab-border) !important; }
  .tab-btn:hover { border-color: #8896a7; color: #f1f5f9; }
  .tab-btn.active { background: var(--tab-active-bg); border-color: transparent; color: #f8fafc; font-size: 0.86rem; animation: titlePop 0.25s cubic-bezier(0.34,1.3,0.64,1); }
  .ss-tile, .cc-tile, .cm-tile { border: 1px solid #475569 !important; }
  .tab-btn.active::before { content:''; position:absolute; inset:-2px; border-radius:10px; padding:2px; background:linear-gradient(to bottom,var(--vol-color,#38bdf8) 0%,var(--vol-color,#38bdf8) 20%,var(--gl-color,#38bdf8) 80%,var(--gl-color,#38bdf8) 100%); -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0); -webkit-mask-composite:destination-out; mask-composite:exclude; pointer-events:none; z-index:1; }

  @media (max-width: 900px) {
    .charts-grid { grid-template-columns: 1fr; }
    .main { padding: 16px; }
  }

  .delta-tooltip { position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:var(--chart-bg); border:1px solid var(--section-border); border-radius:10px; padding:10px 14px;
    font-size:0.75rem; color:#f8fafc; white-space:nowrap; pointer-events:none;
    opacity:0; transition:opacity 0.15s; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,0.4); }
  .rep-card:hover .delta-tooltip { opacity:1; }
  .delta-tooltip .dt-row { display:flex; justify-content:space-between; gap:20px; margin-bottom:3px; }
  .delta-tooltip .dt-row:last-child { margin-bottom:0; }
  .delta-tooltip .dt-label { color:#64748b; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; }
  .delta-tooltip .dt-pos { color:#4ade80; }
  .delta-tooltip .dt-neg { color:#f87171; }
  .delta-tooltip .dt-zero { color:#475569; }

  /* ── Tablet (641-900px) ──────────────────────────────────────── */
  @media (min-width: 641px) and (max-width: 900px) {
    .main { padding: 16px; }
    .team-grid { grid-template-columns: repeat(2, 1fr); }
    .team-grid > div[style*="span 3"] { grid-column: span 2; grid-template-columns: 1fr 1fr !important; }
    .charts-grid { grid-template-columns: 1fr; }
  }
  /* ── Phone (≤640px) ──────────────────────────────────────────── */
  @media (max-width: 640px) {
    .main { padding: 6px 8px; }
    .team-grid { grid-template-columns: 1fr !important; gap: 10px; margin-bottom: 14px; }
    .team-grid > div[style*="span 3"] { grid-column: 1 !important; grid-template-columns: 1fr !important; gap: 10px; }
    .rep-card { padding: 12px 10px; }
    .rep-card .rep-name { font-size: 1rem; }
    /* Section: header fixed width, charts scroll right */
    .rep-section { padding: 0; overflow: hidden; }
    .rep-section-header { display: flex; flex-direction: column; padding: 12px 10px 10px; align-items: flex-start; gap: 6px; }
    .rep-section-header .badges { display: flex; flex-wrap: wrap; gap: 4px 0; align-items: center; }
    .rep-section-header .badge-label { font-size: 0.65rem; margin: 0 4px 0 10px; }
    .rep-section-header .badge-grp:first-child .badge-label { margin-left: 0; }
    .badge { font-size: 0.72rem; padding: 2px 7px; }
    /* Charts: 2x wide, scroll horizontally */
    .charts-grid { overflow-x: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x; display: block; padding: 0 8px 10px; scrollbar-width: none; }
    .charts-grid::-webkit-scrollbar { display: none; }
    .chart-box { min-width: calc(200vw - 32px); width: calc(200vw - 32px); padding: 10px 6px; margin-bottom: 12px; }
    .chart-box:last-child { margin-bottom: 0; }
    .chart-box .chart-title { position: sticky; left: 6px; margin-bottom: 6px; }
    .chart-box canvas { height: 170px !important; }
    /* Tabs: snap scrolling */
    .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; gap: 6px;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
            scroll-snap-type: x proximity; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { flex-shrink: 0; font-size: 0.7rem; min-width: auto; padding: 7px 14px; scroll-snap-align: start; }
    .tab-btn.team-tab { min-width: 7.5rem; border-width: 1px !important; }
    #q2LabelPct { display: none; }
    #q2LabelElapsed, #q2LabelRemain { font-size: 0.62rem; }
    #deployBadge { font-size: 0.65rem; bottom:8px; right:10px; opacity:0.6; }

    .header > div:first-child { flex-wrap: wrap; gap: 8px; }
    #dashDateSelect { font-size: 0.75rem; padding: 5px 12px; }
    /* Happy Days: one per line */
    #nationalDayFooter .hd-days { display: flex; flex-direction: column; gap: 2px; }
    /* Recent Tx + Go Lives: stack vertically on mobile */
    .recent-panels { flex-direction: column !important; }
    .recent-panels > div + div { border-left: none !important; border-top: 1px solid var(--card-divider); }
    /* Account names: truncate on mobile */
    .recent-name-cell { max-width: 140px; }
    /* Charts: allow vertical page scroll even when touching a canvas */
    canvas { touch-action: pan-y !important; }
  }

  /* ── Daily Snapshot Panel ──────────────────────────────────────── */
  #snapPanel { background:var(--snap-bg); border:1px solid var(--snap-border); border-radius:12px; margin-bottom:24px; overflow:hidden; transition:background 0.3s,border-color 0.3s; }
  #snapContent { padding:12px 16px 16px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  #snapTable { min-width:560px; }
  #snapTable { width:100%; border-collapse:collapse; font-size:0.78rem; }
  #snapTable thead tr:first-child th { padding:6px 4px 3px; font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#94a3b8; text-align:center; }
  #snapTable thead tr:first-child th:first-child { text-align:left; padding-left:14px; }
  #snapTable thead tr:last-child th { padding:2px 8px 5px; font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:#64748b; border-bottom:1px solid var(--snap-border); text-align:center; }
  #snapTable thead tr:last-child th:first-child { text-align:left; padding-left:14px; }
  #snapTable td { padding:5px 8px; border-bottom:1px solid var(--card-divider); text-align:center; white-space:nowrap; }
  #snapTable td.sn { font-size:0.8rem; font-weight:600; color:#e2e8f0; text-align:left; padding-left:14px; min-width:80px; }
  #snapTable td.sn-right { font-size:0.8rem; font-weight:600; color:#e2e8f0; text-align:right; padding-right:14px; min-width:80px; border-left:1px solid var(--snap-border); }
  #snapTable th.th-sep, #snapTable td.th-sep { border-left:2px solid var(--snap-border); }
  #snapTable thead tr:first-child th.th-sep { border-left:2px solid var(--snap-border); }
  #snapTable tbody tr:nth-child(even):not(.snap-team):not(.snap-divider) td { background:rgba(255,255,255,0.025); }
  #snapTable tbody tr:not(.snap-team):not(.snap-divider):hover td { background:rgba(255,255,255,0.06); }
  #snapTable tr.snap-team td { background:rgba(20,50,30,0.5); border-top:1px solid var(--snap-border); }
  body:not(.q3-mode) #snapTable tr.snap-team td { background:rgba(30,50,80,0.5); }
  #snapTable tr.snap-team:hover td { background:rgba(30,70,45,0.65); }
  body:not(.q3-mode) #snapTable tr.snap-team:hover td { background:rgba(40,65,100,0.65); }
  #snapTable tr.snap-team td.sn { color:#cbd5e1; font-weight:700; }
  #snapTable tr.snap-team td.sn-right { color:#cbd5e1; font-weight:700; }
  #snapTable tr.snap-divider td { padding:2px 0; border-bottom:1px solid var(--snap-border); background:none; }
  #snapTable tr:last-child td { border-bottom:none; }
  .sv { color:#e2e8f0; font-weight:400; margin-right:4px; }
  .sg { color:#e2e8f0; font-weight:400; }
  .snap-zero { color:var(--card-divider); }

  /* ── Activity Panel ─────────────────────────────────────────────── */
  #activityPanel { margin-bottom:24px; overflow:hidden; }
  #activityPanel .act-header { display:flex; align-items:center; justify-content:space-between; padding:10px 0; cursor:pointer; user-select:none; border-bottom:1px solid var(--card-divider); margin-bottom:0; }
  #activityPanel .act-header:hover { opacity:0.8; }
  #activityContent { overflow-x:auto; -webkit-overflow-scrolling:touch; padding:0 0 12px; }
  #activityTable { min-width:620px; width:100%; border-collapse:collapse; font-size:0.78rem; }
  #activityTable thead tr:first-child th { padding:6px 4px 3px; font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#94a3b8; text-align:center; }
  #activityTable thead tr:first-child th:first-child { text-align:left; padding-left:14px; }
  #activityTable thead tr:last-child th { padding:2px 8px 5px; font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:#64748b; border-bottom:1px solid var(--snap-border); text-align:center; }
  #activityTable thead tr:last-child th:first-child { text-align:left; padding-left:14px; }
  #activityTable td { padding:5px 8px; border-bottom:1px solid var(--card-divider); text-align:center; white-space:nowrap; }
  #activityTable td.sn { font-size:0.8rem; font-weight:600; color:#e2e8f0; text-align:left; padding-left:14px; min-width:90px; }
  #activityTable th.th-sep, #activityTable td.th-sep { border-left:2px solid var(--snap-border); }
  #activityTable thead tr:first-child th.th-sep { border-left:2px solid var(--snap-border); }
  #activityTable tbody tr:nth-child(even):not(.snap-team):not(.snap-divider) td { background:rgba(255,255,255,0.025); }
  #activityTable tbody tr:not(.snap-team):not(.snap-divider):hover td { background:rgba(255,255,255,0.06); }
  #activityTable tr.snap-team td { background:rgba(20,50,30,0.5); border-top:1px solid var(--snap-border); }
  body:not(.q3-mode) #activityTable tr.snap-team td { background:rgba(30,50,80,0.5); }
  #activityTable tr.snap-team:hover td { background:rgba(30,70,45,0.65); }
  body:not(.q3-mode) #activityTable tr.snap-team:hover td { background:rgba(40,65,100,0.65); }
  #activityTable tr.snap-team td.sn { color:#cbd5e1; font-weight:700; }
  #activityTable tr.snap-divider td { padding:2px 0; border-bottom:1px solid var(--snap-border); background:none; }
  #activityTable tr:last-child td { border-bottom:none; }

  /* ── Medal borders on top 3 rep tiles ──────────────────────────── */
  .rank-1 { border: 2px solid rgba(255,215,0,0.75) !important; box-shadow: 0 0 10px rgba(255,215,0,0.08); }
  .rank-2 { border: 2px solid rgba(192,192,192,0.6) !important; box-shadow: 0 0 8px rgba(192,192,192,0.06); }
  .rank-3 { border: 2px solid rgba(180,105,55,0.6) !important; box-shadow: 0 0 7px rgba(180,105,55,0.05); }

  #fetchStatus { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--section-bg); border:1px solid var(--section-border); border-radius:12px; padding:20px 32px;
    font-size:0.85rem; color:#94a3b8; text-align:center; z-index:9999;
    display:none; pointer-events:none; }

  @keyframes barReveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0% 0 0); } }
  .bar-fill { clip-path: inset(0 0 0 0); }

<script>
(function() {
  const KEY = 'ss_auth_v1';
  if (localStorage.getItem(KEY) === '1') return;
  document.documentElement.style.visibility = 'hidden';
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#0a1222;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;';
  overlay.innerHTML = `
    <div style="text-align:center;max-width:340px;width:100%;padding:0 24px;">
      <div style="font-size:1.6rem;font-weight:700;color:#f8fafc;letter-spacing:-0.02em;margin-bottom:6px;">The Plastics</div>
      <div style="font-size:0.85rem;color:#38bdf8;margin-bottom:32px;">Q2 2026 · Performance Dashboard</div>
      <input id="pw_input" type="password" placeholder="Password" autofocus
        style="width:100%;padding:12px 16px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#f8fafc;font-size:1rem;outline:none;box-sizing:border-box;transition:border-color 0.15s;"/>
      <div id="pw_err" style="color:#f87171;font-size:0.8rem;margin-top:10px;min-height:18px;"></div>
      <button id="pw_btn"
        style="margin-top:8px;width:100%;padding:12px;background:#38bdf8;color:#0a1222;font-weight:700;font-size:0.95rem;border:none;border-radius:10px;cursor:pointer;transition:opacity 0.15s;">
        Enter
      </button>
    </div>`;
  document.body.appendChild(overlay);
  document.documentElement.style.visibility = '';
  const input = overlay.querySelector('#pw_input');
  const btn   = overlay.querySelector('#pw_btn');
  const err   = overlay.querySelector('#pw_err');
  function attempt() {
    if (input.value === 'Squad') {
      localStorage.setItem(KEY, '1');
      overlay.style.transition = 'opacity 0.3s';
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 300);
    } else {
      err.textContent = 'Incorrect password. Try again.';
      input.value = '';
      input.style.borderColor = '#f87171';
      setTimeout(() => { input.style.borderColor = '#334155'; err.textContent = ''; }, 1800);
    }
  }
  btn.addEventListener('click', attempt);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  input.addEventListener('focus', () => input.style.borderColor = '#38bdf8');
  input.addEventListener('blur',  () => input.style.borderColor = '#334155');
})();
</script>

function buildCumDots(rows, colIdx, trackArr, todayVal) {

  const sorted = [...rows].sort((a,b) => String(a[0])<String(b[0])?-1:1);

  });
  let cum = 0;
  const dots = qRows.map(r => {
    cum += r[colIdx] || 0;
    const absI = dIdx(parseCardDate(r[0]));
    if (absI < 0) return null;
    const relI = _isQ3 ? absI - Q3_START_IDX : absI;
    const track = trackArr[relI]?.y || 0;
    const pacing = track > 0 ? cum / track : null;
    return { x: relI, y: cum, pacing, color: pacingColorBright(pacing), today: absI===_todayX };
  }).filter(Boolean);
  // Auto-extend to today if last dot is before today (relative)
  const todayRel = _qRelX;
  if (dots.length && todayRel >= 0 && dots[dots.length-1].x < todayRel) {
    const _ld=dots[dots.length-1], _tr=trackArr[todayRel]?.y||0, _p=_tr>0?_ld.y/_tr:null;
    dots.push({x:todayRel,y:_ld.y,pacing:_p,color:pacingColorBright(_p),today:true});
  }
  if (todayVal !== undefined && todayVal !== null && dots.length) {
    const last = dots[dots.length-1];
    const track = trackArr[last.x]?.y || 0;
    const pacing = track > 0 ? todayVal / track : null;
    return [...dots.slice(0,-1),{x:last.x,y:todayVal,pacing,color:pacingColorBright(pacing),today:last.today}];
  }
  return dots;
}

function repAvgPacing(rep) {
  // In Q2 Final mode, use the actual comp-plan attainment for sort order so it matches the displayed OTE
  if (window._Q2FINAL_MODE && Q2_FINAL_SNAP[rep]?.ote != null) return Q2_FINAL_SNAP[rep].ote;
  const d = getLatestData(rep);
  if (d.volPacing === null && d.glPacing === null) return -1;
  const v = d.volPacing ?? 0, g = d.glPacing ?? 0;
  const rawA = d.avgVolPacing ?? 0;
  const aFloor = rawA < 0.50 ? 0 : rawA;
  if (rep === 'Anna') {
    const aCap = Math.min(aFloor, g >= 1.0 ? 1.33 : 1.10);
    return v * 0.60 + g * 0.25 + aCap * 0.15;
  }
  // Q2 or Q3 Plan 3 (Ramping — Braydon): GL 60% + Vol 30% + Avg 10%
  if (!_isQ3 || PLAN3_SS_Q3.has(rep)) {

// Pacing color tiers  (<50 red · 50-75 orange · 75-100 yellow · 100-125 green · 125-150 blue · 150+ purple)
// Smooth gradient: red → orange → yellow → green → teal → purple
function _gi(pct, stops) {
  if (pct === null || pct === undefined) return 'hsl(215,18%,35%)';
  pct = Math.max(0, pct);
  for (let i = 0; i < stops.length-1; i++) {
    const [p0,h0,s0,l0]=stops[i], [p1,h1,s1,l1]=stops[i+1];
    if (pct <= p1) {
      const t=(pct-p0)/(p1-p0);
      return `hsl(${Math.round(h0+t*(h1-h0))},${Math.round(s0+t*(s1-s0))}%,${Math.round(l0+t*(l1-l0))}%)`;
    }
  }
  const s=stops[stops.length-1]; return `hsl(${s[1]},${s[2]}%,${s[3]}%)`;
}

function fmt$(v) {
  if (v === null || v === undefined) return '—';
  if (v >= 1000000) return '$' + (v/1000000).toFixed(2) + 'm';
  if (v >= 1000) return '$' + Math.round(v/1000) + 'k';
  return '$' + Math.round(v);
}

function fmtFull$(v) {
  if (v === null || v === undefined) return '—';
  return '$' + Math.round(v).toLocaleString();
}

function fmtM3$(v) {
  if (v === null || v === undefined) return '—';
  if (v >= 1000000) return '$' + (v/1000000).toFixed(3) + 'm';
  if (v >= 1000) return '$' + Math.round(v/1000) + 'k';
  return '$' + Math.round(v);
}

function fmtPct(v) {

function getLatestData(rep) {
  const q = _isQ3 ? (quotas_q3[rep] || quotas[rep]) : quotas[rep];
  const days = REP_LIVE_DATA?.[rep] || REP_STATIC_PROCESSED[rep];
  if (!days?.length) return {lastVol:null,lastGL:null,lastVolTrack:null,lastGLTrack:null,lastAvgVol:null,volPacing:null,glPacing:null,avgVolPacing:null};
  // Mirror snapshot's pattern: cap ETL at yesterday, add TODAY_LIVE_DATA separately
  // so cards and snapshot always agree on QTD totals.
  const _mt2 = new Date(Date.now()-6*3600000);
  const _MO3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const _todayActLbl = _MO3[_mt2.getUTCMonth()]+' '+_mt2.getUTCDate();
  const _todayActIdx = Q2_DAYS.indexOf(_todayActLbl);
  const _hasLiveNow  = !!TODAY_LIVE_DATA && _todayActIdx >= 0;
  // ETL cap: yesterday when live is available, otherwise use last available data point
  const _etlCap  = _hasLiveNow ? _todayActIdx - 1 : (days[days.length-1]?.x ?? 0);
  const etlCur   = [...days].filter(d => d.x <= _etlCap).sort((a,b) => b.x-a.x)[0];
  // Q3 offset: subtract last Q2 cumulative so ETL vol starts at 0 on Aug 1
  const qBase    = _isQ3 ? [...days].filter(d => d.x < Q3_START_IDX).sort((a,b) => b.x-a.x)[0] : null;
  const etlVol   = (etlCur?.cumVol || 0) - (qBase?.cumVol || 0);
  const etlGL    = (etlCur?.cumGL  || 0) - (qBase?.cumGL  || 0);
  const liveVol  = _hasLiveNow ? (TODAY_LIVE_DATA[rep]?.vol || 0) : 0;
  const liveGL   = _hasLiveNow ? (TODAY_LIVE_DATA[rep]?.gl  || 0) : 0;
  const cumVol43 = Math.max(0, etlVol + liveVol);
  const cumGL43  = Math.max(0, etlGL  + liveGL);
  const startIdx = _isQ3 ? Q3_START_IDX : Math.max(0, dIdx(repQ2Start[rep]||'May 1'));
  const total    = _isQ3 ? QUARTER_LEN   : (Q2_END_IDX - startIdx + 1);
  const trackIdx = _todayX >= 0 ? _todayX : (etlCur?.x ?? 0);
  const elapsed  = Math.max(0, trackIdx - startIdx + 1);
  const volTrackF = total > 0 ? q.vol * elapsed / total : 0;
  const glTrackF  = total > 0 ? q.gl  * elapsed / total : 0;
  return {
    lastVol: cumVol43, lastGL: cumGL43,
    lastVolTrack: Math.round(volTrackF), lastGLTrack: Math.round(glTrackF),
    lastAvgVol: _qAvgVol(rep),
    volPacing: volTrackF>0 ? cumVol43/volTrackF : null,
    glPacing:  glTrackF>0  ? cumGL43/glTrackF   : null,

  };
}

// ── Q2 calendar (all days) + working-day helpers ─────────────────────────────
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Q2_DAYS = every calendar day May 1–Oct 31 (covers Q2+Q3; x-axis, data indexing, range queries)
const Q2_DAYS = (() => {
  const days = [], d = new Date(2026, 4, 1), end = new Date(2026, 9, 31);
  while (d <= end) { days.push(MO[d.getMonth()]+' '+d.getDate()); d.setDate(d.getDate()+1); }
  return days;
})(); // 184 calendar days (Q2: 0–91, Q3: 92–183)

const Q3_START_IDX = 92;  // Aug 1 = index 92 in Q2_DAYS
const Q2_END_IDX   = 91;  // Jul 31 = index 91
const QUARTER_LEN  = 92;  // Both Q2 and Q3 are 92 days

// All pacing uses plain calendar days. No working-day adjustments.

// _todayX: mutable so date-selector changes can recompute it
let _todayX = (() => {
  const dt = new Date(DASH_DATE+'T12:00:00');
  const lbl = MO[dt.getMonth()]+' '+dt.getDate();
  const idx = Q2_DAYS.indexOf(lbl);
  return idx >= 0 ? idx : Q2_DAYS.length - 1;
})();
let _isQ3   = _todayX >= Q3_START_IDX;

document.body.classList.toggle('q3-mode', _isQ3);

let _qEnd   = _isQ3 ? Q3_START_IDX + QUARTER_LEN - 1 : Q2_END_IDX;
let _qRelX  = _isQ3 ? _todayX - Q3_START_IDX : _todayX;
let _qLabel = _isQ3 ? 'Q3 2026' : 'Q2 2026';
// DASH_DATE moved to top — see initialization at top of script

// Recompute all quarter-context variables from current DASH_DATE
function _recomputeQCtx() {
  const dt = new Date(DASH_DATE+'T12:00:00');
  const lbl = MO[dt.getMonth()]+' '+dt.getDate();
  const idx = Q2_DAYS.indexOf(lbl);
  _todayX = idx >= 0 ? idx : Q2_DAYS.length - 1;
  _isQ3   = _todayX >= Q3_START_IDX;
  _qStart = _isQ3 ? Q3_START_IDX : 0;
  _qEnd   = _isQ3 ? Q3_START_IDX + QUARTER_LEN - 1 : Q2_END_IDX;
  _qRelX  = _isQ3 ? _todayX - Q3_START_IDX : _todayX;
  _qLabel = _isQ3 ? 'Q3 2026' : 'Q2 2026';
  // Update x-axis config for current quarter
  MONDAY_DATES = _isQ3 ? Q3_MONDAY_DATES : Q2_MONDAY_DATES;
  X_SHOW_INDICES = new Set(
    _isQ3
      ? [...Q3_MONDAY_DATES].map(d=>dIdx(d)-Q3_START_IDX).filter(i=>i>=0&&i<QUARTER_LEN)
      : [...Q2_MONDAY_DATES].map(d=>dIdx(d)).filter(i=>i>=0&&i<QUARTER_LEN)
  );
  CHART_X_OPTS.max = QUARTER_LEN - 1;
  CHART_X_OPTS.afterBuildTicks = s => { s.ticks = [...X_SHOW_INDICES].sort((a,b)=>a-b).map(v=>({value:v})); };
  document.body.classList.toggle('q3-mode', _isQ3);
}

function getAvailableDates() {
  const dates = new Set();
  // Static fallback data
  for (const rows of Object.values(REP_STATIC_DAILY)) {
    rows.forEach(r => { if (r[1]||r[2]) dates.add(r[0]); });
  }
  SS_STATIC.forEach(r => { if (r[1]||r[2]) dates.add(r[0]); });
  CM_STATIC.forEach(r => { if (r[1]||r[2]) dates.add(r[0]); });
  // Live data dates (card 46414) — includes today's data when available
  if (REP_LIVE_DATA) {
    for (const days of Object.values(REP_LIVE_DATA)) {
      days.forEach(d => {
        const dt = Q2_DAYS[d.x];
        if (dt) {
          const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const [mon,day] = dt.split(' ');
          const iso = `2026-${String(mo.indexOf(mon)+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          dates.add(iso);
        }
      });
    }
  }
  if (SS_LIVE_DATA) SS_LIVE_DATA.forEach(r => { if (r[1]||r[2]) dates.add(r[0]?.slice(0,10)); });
  if (CM_LIVE_DATA) CM_LIVE_DATA.forEach(r => { if (r[1]||r[2]) dates.add(r[0]?.slice(0,10)); });
  return [...dates].filter(Boolean).sort();
}

function processRepDataAsOf(dateStr) {
  const result = {};
  for (const [name, rows] of Object.entries(REP_STATIC_DAILY)) {
    let cv=0, cg=0;
    const out=[];
    for (const [d,vol,gl] of [...rows].sort((a,b)=>a[0]<b[0]?-1:1)) {
      if (d > dateStr) break;
      cv+=vol||0; cg+=gl||0;
      const dayI=dIdx(['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(d.slice(5,7))-1]+' '+parseInt(d.slice(8)));
      if (dayI>=0) out.push({x:dayI,cumVol:cv,cumGL:cg,today:dayI===_todayX});
    }
    result[name]=out;
  }
  return result;
}

function filterStatic(rows, dateStr) {

}

function buildRepStaticProcessed() {
  const result = {};
  for (const [name, rows] of Object.entries(REP_STATIC_DAILY)) {
    let cv = 0, cg = 0;
    const out = [];
    for (const [dateStr, vol, gl] of [...rows].sort((a,b)=>a[0]<b[0]?-1:1)) {

function linearTrack(repKey, quota) {
  if (_isQ3) {

    return Array.from({length:QUARTER_LEN}, (_, i) => ({x:i, y:quota*(i+1)/QUARTER_LEN}));

// Plugin: draw the latest data point value next to that dot, in the dot's color
function makeLastPointLabelPlugin(datasetIdx, formatFn) {
  return {
    id: 'lastPointLabel',
    afterDatasetsDraw(chart) {
      const ds = chart.data.datasets[datasetIdx];
      if (!ds?.data?.length) return;
      const { ctx, scales: { x, y } } = chart;
      if (!x || !y) return;
      const lastPt = [...ds.data].sort((a, b) => b.x - a.x)[0];
      if (!lastPt || lastPt.y == null) return;
      const xPx = x.getPixelForValue(lastPt.x);
      const yPx = y.getPixelForValue(lastPt.y);
      const label = formatFn(lastPt.y);
      ctx.save();
      ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, sans-serif';
      const tw = ctx.measureText(label).width;
      const tx = (xPx + 8 + tw < x.right) ? xPx + 8 : xPx - tw - 8;
      const ty = (yPx - 10 > y.top + 4) ? yPx - 16 : yPx + 18;
      // Dark pill background for readability
      ctx.fillStyle = 'rgba(10,20,38,0.82)';
      ctx.beginPath();
      ctx.roundRect(tx - 4, ty - 11, tw + 8, 16, 4);
      ctx.fill();
      ctx.fillStyle = lastPt.color || '#ffffff';
      ctx.textAlign = 'left';
      ctx.fillText(label, tx, ty);
      ctx.restore();
    }
  };
}

// Plugin: draw ⭐ at the first dot that crosses the flat quota target line
function makeStarPlugin(dotData, datasetIdx, quotaVal) {
  const starIdx = dotData.findIndex(d => d.y >= quotaVal);
  if (starIdx < 0) return null;
  return {
    id: 'starPlugin',
    afterDraw(chart) {
      const { ctx, scales: { x, y } } = chart;
      if (!x || !y) return;
      const pt = dotData[starIdx];
      if (!pt) return;
      ctx.save();
      ctx.font = '13px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⭐', x.getPixelForValue(pt.x), y.getPixelForValue(pt.y));
      ctx.restore();
    }
  };
}

// Plugin: draw target value label at right edge — clamps so it never clips
function makeTargetLabelPlugin(label, targetVal) {
  return {
    id: 'targetLabel',
    afterDraw(chart) {
      const { ctx, scales: { x, y } } = chart;
      if (!x || !y) return;
      const rawY = y.getPixelForValue(targetVal);
      // If target is above visible area, skip
      if (rawY > y.bottom) return;
      // Draw above line normally; if too close to top, draw below instead
      const textY = rawY + 4; // center on tick line like y-axis labels
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(label, x.right + 8, textY);
      ctx.restore();
    }
  };
}

// Build daily avg vol dots as cumVol/cumGL from raw daily rows (team charts)
function buildDailyAvgDots(rows) {
  let cumVol = 0, cumGL = 0;
  return rows.map(r => {
    cumVol += r[1] || 0;
    cumGL  += r[2] || 0;
    if (cumGL === 0) return null;
    const dayI = dIdx(parseCardDate(r[0]));
    if (dayI < 0) return null;
    const val = cumVol / cumGL;
    const pacing = val / (_isQ3 ? 2650 : 2000);
    return { x: dayI, y: val, pacing, color: pacingColorBright(pacing), today: dayI===_todayX, count: cumGL };
  }).filter(Boolean);
}

// Build team-level running avg from per-practice first-30 vol data
function buildTeamAvgDots(practices) {
  // In Q3 mode only count practices that graduated this quarter (Aug 1+)
  const filtered = _isQ3 ? practices.filter(p => p.x >= Q3_START_IDX) : practices;
  filtered.sort((a,b) => a.x-b.x);
  let cumVol=0, cnt=0;
  const dots=[];
  for (let i=0; i<filtered.length; i++) {
    const p=filtered[i];
    cumVol+=p.vol; cnt++;
    // Only emit one dot per day — wait until the last practice for this x-value
    if (i===filtered.length-1 || filtered[i+1].x>p.x) {
      const _avTgt=_isQ3?2650:2000; const y=cumVol/cnt, pacing=y/_avTgt;
      dots.push({x:p.x, y, pacing, color:pacingColorBright(pacing), count:cnt});
    }
  }
  if (dots.length && dots[dots.length-1].x < _todayX) {
    const ld=dots[dots.length-1]; const _avTgt2=_isQ3?2650:2000;
    dots.push({x:_todayX, y:ld.y, pacing:ld.y/_avTgt2, color:pacingColorBright(ld.y/_avTgt2), count:ld.count, today:true});
  }
  return dots;
}

// Interpolate weekly actuals to a dot per Q2 weekday (within the reported range)
function buildDailyDots(weeks, valField, trackArr) {
  const anchors = weeks
    .filter(w => w[valField] !== null)
    .map(w => ({ i: dIdx(w.date), v: w[valField] }))
    .filter(a => a.i >= 0).sort((a, b) => a.i - b.i);
  if (!anchors.length) return [];
  const first = anchors[0].i, last = anchors[anchors.length - 1].i;
  const dots = [];
  for (let i = first; i <= last; i++) {
    let lo = anchors[0], hi = anchors[anchors.length - 1];
    for (let j = 0; j < anchors.length - 1; j++) {
      if (anchors[j].i <= i && anchors[j+1].i >= i) { lo = anchors[j]; hi = anchors[j+1]; break; }
    }
    const val = lo.i === hi.i ? lo.v : lo.v + (hi.v - lo.v) * (i - lo.i) / (hi.i - lo.i);
    const track = trackArr[i] ? trackArr[i].y : 0;
    const pacing = track > 0 ? val / track : null;
    dots.push({ x: i, y: val, pacing, color: pacingColorBright(pacing) });
  }
  return dots;
}

function buildVolChart(repKey) {

    }).filter(d => d.y > 0);

      if (i > 0) {
        const prev = filled[filled.length - 1];
        for (let x = prev.x + 1; x < dotData[i].x; x++) {
          const tr = trackArr[x]?.y || 0;
          const p = tr > 0 ? prev.y / tr : null;

  const flatVolTarget = Array.from({length:QUARTER_LEN}, (_, i) => ({ x: i, y: q.vol }));

      plugins: { legend: { display: false }, tooltip: { mode:'nearest', intersect:true, usePointStyle:true, backgroundColor:'#1e293b', borderColor:'#334155', borderWidth:1, padding:{x:12,y:8}, cornerRadius:8, caretPadding:10, titleColor:'#a0b0c0', bodyColor:'#f8fafc', bodyFont:{family:'-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',size:12}, titleFont:{family:'-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',size:11,weight:'bold'}, filter:(item)=>item.datasetIndex===1, callbacks: { title:(items)=>{const _d=items.find(i=>i.datasetIndex===1)?.raw;return _d?Q2_DAYS[Math.round(_d.x)+_qStart]||'':'';}, labelColor:(c)=>{ const col=c.raw?.color||(Array.isArray(c.dataset.backgroundColor)?c.dataset.backgroundColor[c.dataIndex]:c.dataset.backgroundColor)||'#38bdf8'; return{borderColor:col,backgroundColor:col}; }, label:(c)=>{ const d=c.raw,prev=prevDot(c),delta=prev!==undefined?d.y-prev.y:null; const lines=[` ${fmt$(d.y)}`]; if(delta!==null)lines.push(`    ${fmtDelta$(delta)}`); if(d.pacing!==undefined)lines.push(` ${fmtPct(d.pacing)}`); return lines; } } } },

function buildAvgVolChart(repKey) {
  const _avgTgt = _isQ3 ? 2650 : 2000;
  const flatTarget = Array.from({length:QUARTER_LEN}, (_, i) => ({ x: i, y: _avgTgt }));

  // _todayIdx as relative index within current quarter (same as _qRelX)
  const _todayIdx = _qRelX;
  // Build avg vol dots from 30-day filtered history only (AVG_VOL_HISTORY)
  // AVG_VOL_HISTORY uses absolute x indices; convert to relative for current quarter
  let dotData = (() => {
    const hist = AVG_VOL_HISTORY[repKey];
    // Hoist baseline count so fallback can compute Q3-adjusted count too
    let _q3BaseCount = 0;
    if (hist && hist.length) {
      // In Q3, subtract the Q2 baseline count so tooltip shows Q3-only account count
      const q2Last = _isQ3 ? hist.filter(d => d.x < Q3_START_IDX).sort((a,b)=>b.x-a.x)[0] : null;
      _q3BaseCount = q2Last?.count ?? 0;
      const qHist = hist
        .filter(d => _isQ3 ? d.x >= Q3_START_IDX : d.x < Q3_START_IDX)
        .map(d => {
          const xRel = _isQ3 ? d.x - Q3_START_IDX : d.x;
          const pacing = d.y / _avgTgt;
          return { x: xRel, y: d.y, pacing, color: pacingColorBright(pacing), count: Math.max(0, (d.count||0) - _q3BaseCount) };
        });
      if (qHist.length) {
        // Deduplicate by x — if multiple merchants graduated same day, keep last (highest-count) entry
        const byX = {};
        for (const pt of qHist) { byX[pt.x] = pt; }
        return Object.values(byX).sort((a,b) => a.x - b.x);
      }
    }
    // Fallback: single point from AVG_VOL_ACTUALS (rep has Q2 history but no Q3-graduated accounts yet)
    const v = AVG_VOL_ACTUALS[repKey];
    if (!v || v <= 0) return []; // No 30+ day accounts yet — show nothing
    const p = v / _avgTgt;
    const _cnt = _isQ3 ? Math.max(0, (AVG_VOL_COUNTS[repKey]||0) - _q3BaseCount) : (AVG_VOL_COUNTS[repKey]||0);
    if (_isQ3 && _cnt === 0) return []; // No Q3-graduated accounts yet — don't show stale Q2 dot
    return [{ x:_todayIdx, y:v, pacing:p, color:pacingColorBright(p), count:_cnt }];
  })();
  // Carry forward last known value to today if history exists but ends before today
  if (dotData.length && dotData[dotData.length-1].x < _todayIdx) {
    const last = dotData[dotData.length-1];
    for (let i = last.x + 1; i <= _todayIdx; i++) {
      dotData.push({ x:i, y:last.y, pacing:last.pacing, color:last.color, count:last.count });
    }
  }
  // Mark today's dot
  if (dotData.length) dotData[dotData.length-1].today = (dotData[dotData.length-1].x === _todayIdx);

  // Center avg vol target on y-axis, snap bounds to nearest $500
  // _avgTgt already defined at top of function
  const deviation = dotData.length ? Math.max(...dotData.map(d => Math.abs(d.y - _avgTgt))) : _avgTgt;
  const range = Math.max(deviation, 500) * 1.2;
  const yMin = Math.max(0, Math.floor((_avgTgt - range) / 500) * 500);
  const yMax = Math.ceil((_avgTgt + range) / 500) * 500;

  if (chartInstances[repKey + '_avg']) { try { chartInstances[repKey + '_avg'].destroy(); } catch(e) {} }
  const ctx = document.getElementById('chart-' + repKey + '-avg').getContext('2d');
  chartInstances[repKey + '_avg'] = new Chart(ctx, {
    type: 'scatter',
    plugins: [makeTargetLabelPlugin((_isQ3?'$2,650':'$2,000'), _avgTgt), makeLastPointLabelPlugin(1, v => fmtFull$(v))],
    data: { datasets: [
      { type: 'line', label: 'Target', data: flatTarget, borderColor: '#ffffff', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, pointHoverRadius: 0, fill: false, order: 2 },
      makeAvgDataset(dotData)
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 600 }, layout: { padding: { right: 68 } },
      plugins: { legend: { display: false }, tooltip: { mode:'nearest', intersect:true, usePointStyle:true, backgroundColor:'#1e293b', borderColor:'#334155', borderWidth:1, padding:{x:12,y:8}, cornerRadius:8, caretPadding:10, titleColor:'#a0b0c0', bodyColor:'#f8fafc', bodyFont:{family:'-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',size:12}, titleFont:{family:'-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',size:11,weight:'bold'}, filter:(item)=>item.datasetIndex===1, callbacks: { title:(items)=>{const _d=items.find(i=>i.datasetIndex===1)?.raw;return _d?Q2_DAYS[Math.round(_d.x)+_qStart]||'':'';}, labelColor:(c)=>{ const col=c.raw?.color||(Array.isArray(c.dataset.backgroundColor)?c.dataset.backgroundColor[c.dataIndex]:c.dataset.backgroundColor)||'#38bdf8'; return{borderColor:col,backgroundColor:col}; }, label:(c)=>{ const d=c.raw,dt=Q2_DAYS[Math.round(d.x)+_qStart]||'',prev=prevDot(c),delta=prev!==undefined?d.y-prev.y:null; const val=` ${fmtFull$(d.y)}${d.count?' ('+d.count+')':''}`; const lines=[val]; if(delta!==null)lines.push(`    ${fmtDeltaAvg(delta)}`); if(d.pacing!==undefined)lines.push(` ${fmtPct(d.pacing)}`); return lines; } } } },
      scales: { x: CHART_X_OPTS, y: { min: yMin, max: yMax, ticks: { color: ctx => ctx.tick.value === _avgTgt ? '#ffffff' : '#64748b', font: { size: 10 }, callback: v => v % 500 === 0 ? fmtFull$(v) : '' }, grid: { color: GC() } } }
    }
  });
}

// Global CC pacing at a given absolute day index — Q3-aware
function ccRepPacingAtIdx(rep, dayIdx) {
  const data = CC_LIVE_DATA?.[rep]; if (!data) return null;
  const pt = [...data].filter(d => d.x <= dayIdx).sort((a,b) => b.x-a.x)[0]; if (!pt) return null;
  const _isQ3idx = dayIdx >= Q3_START_IDX;
  const q = _isQ3idx ? (CC_QUOTAS_Q3[rep] || CC_QUOTAS[rep] || {vol:55000,gl:16}) : (CC_QUOTAS[rep] || {vol:55000,gl:16});
  const startIdx = _isQ3idx ? Q3_START_IDX : Math.max(0, dIdx(CC_REP_START[rep] || 'May 1'));
  if (dayIdx < startIdx) return null;
  const totalActive = _isQ3idx ? QUARTER_LEN : (Q2_END_IDX - startIdx + 1);
  const activeElapsed = Math.max(0, Math.min(dayIdx - startIdx + 1, totalActive));
  if (activeElapsed <= 0) return null;
  const q2base = _isQ3idx ? (window.CC_Q2_FINAL?.[rep] || {gl:0,vol:0}) : {gl:0,vol:0};
  const cumVol = pt.cumVol - q2base.vol;
  const cumGL  = pt.cumGL  - q2base.gl;
  const volT = q.vol * activeElapsed / totalActive;
  const glT  = q.gl  * activeElapsed / totalActive;
  const vp = volT > 0 ? cumVol / volT : null, gp = glT > 0 ? cumGL / glT : null;
  const rawA_cc = AVG_VOL_ACTUALS[rep] ? AVG_VOL_ACTUALS[rep] / (q.avg_vol || 2650) : 0;
  const aFloor_cc = rawA_cc < 0.50 ? 0 : rawA_cc;
  // Q2 or Q3 Plan 3 (Ramping — Karl/Chaz/Sam/Tye): GL 60% + Vol 30% + Avg 10%
  if (!_isQ3idx || PLAN3_CC_Q3.has(rep)) {
    const _vp = vp ?? 0, _gp = gp ?? 0;
    return Math.min(_vp,1)*0.30 + Math.min(_gp,1)*0.60 + Math.min(aFloor_cc,1)*0.10 + Math.max(0,_gp-1)*0.30;
  }
  // Q3 Plan 2 (Late Ramping): Vol 60% + GL 25% + Avg 15%
  const aCap_cc = Math.min(aFloor_cc, 1.10);
  return (vp??0)*0.60 + (gp??0)*0.25 + aCap_cc*0.15;
}

function buildTeamOteChart(key) {

    const xRel = i - _qStart;
    dots.push({ x: xRel, y: avg, color: pacingColor(avg), pacing: avg });
  }
  buildLineChart('chart-' + key + '-ote', [], dots, fmtPct, 1.0, '100%');
}

function buildTeamRankChart() {
  const canvasId = 'chart-team-rank';
  const ctx = document.getElementById(canvasId)?.getContext('2d');
  if (!ctx) return;
  if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

  // Compute each rep's rank on each day of the current quarter (relative x 0..QUARTER_LEN-1)
  const rankData = {};
  repNames.forEach(rep => { rankData[rep] = []; });
  const repStartIdx = {};
  repNames.forEach(rep => { repStartIdx[rep] = Math.max(_qStart, dIdx(repQ2Start[rep] || 'May 1')); });

  for (let dayI = _qStart; dayI <= _todayX; dayI++) {
    const scored = [];
    repNames.forEach(rep => {
      if (dayI < repStartIdx[rep]) return;
      const p = repPacingAtIdx(rep, dayI);
      scored.push({rep, score: p ?? 0});
    });
    if (!scored.length) continue;
    scored.sort((a, b) => b.score - a.score);
    scored.forEach(({rep}, i) => { rankData[rep].push({x: dayI - _qStart, y: i + 1}); });
  }

  // Plugin: draw rep name next to the last point of each line
  const rankLabelPlugin = {
    id: 'rankLastLabel',
    afterDatasetsDraw(chart) {
      const {ctx: c, scales: {x, y}} = chart;
      chart.data.datasets.forEach(ds => {
        if (!ds.data.length) return;
        const last = ds.data[ds.data.length - 1];
        const px = x.getPixelForValue(last.x);
        const py = y.getPixelForValue(last.y);
        c.save();
        c.font = '600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        c.fillStyle = ds.borderColor;
        c.textAlign = 'left';
        c.textBaseline = 'middle';
        c.fillText(`   #${last.y} ${ds.label}`, px + 8, py);
        c.restore();
      });

  };

  const datasets = repNames.map(rep => {
    const pts = rankData[rep];
    const col = REP_CHART_COLORS[rep];
    return {
      type: 'line',
      label: rep,
      data: pts,
      borderColor: col,
      backgroundColor: col + '18',
      // Only last point visible (hollow circle); intermediate points hidden
      pointBackgroundColor: pts.map((_, i) => i === pts.length - 1 ? '#0f172a' : col),

      pointBorderWidth: pts.map((_, i) => i === pts.length - 1 ? 2 : 0),

      borderWidth: 2,
      tension: 0.25,
      fill: false,
      spanGaps: false,
    };
  });

  // Suppress tooltip when mouse is right of today (blank future area)
  const suppressFutureTooltip = {
    id: 'suppressFutureTooltip',
    beforeEvent(chart, args) {
      if (args.event.type === 'mousemove') {
        const scale = chart.scales?.x;
        chart._rankMousePastToday = scale ? args.event.x > scale.getPixelForValue(_todayX) + 5 : false;
      }
    },
    beforeTooltipDraw(chart) {
      if (chart._rankMousePastToday) return false;
    }
  };

  chartInstances[canvasId] = new Chart(ctx, {
    type: 'scatter',
    plugins: [rankLabelPlugin, suppressFutureTooltip],
    data: {datasets},
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: {duration: 600},
      layout: {padding: {right: 80}},
      interaction: {mode: 'index', intersect: false},
      plugins: {
        legend: {display: false},
        tooltip: {enabled: false}
      },
      scales: {
        x: CHART_X_OPTS,
        y: {
          reverse: true,
          min: 0.5,
          max: repNames.length + 0.5,
          ticks: {
            stepSize: 1,
            color: '#a0b0c0',
            font: {size: 10},
            callback: v => Number.isInteger(v) ? '#' + v : ''
          },
          grid: {color: GC()}
        }
      }
    }
  });
}

    return { type:'line', label:r.label, data:pts, borderColor:r.color, backgroundColor:r.color+'18',
      pointBackgroundColor: pts.map((_,i) => i===pts.length-1 ? '#0f172a' : r.color),

      borderWidth: 2, tension: 0.25, fill: false, spanGaps: false };
  });

  chartInstances[canvasId] = new Chart(ctx, {
    type: 'scatter',
    plugins: [rankLabelPlugin, suppressFuture],
    data: {datasets},
    options: {
      responsive: true, maintainAspectRatio: false, animation: {duration: 600},
      layout: {padding: {right: 90}},
      interaction: {mode: 'index', intersect: false},

          grid: {color:GC()} }
      }
    }
  });
  // Both charts built — show the wrapper (still collapsed)
  const wrap = document.getElementById('rankChartWrap');
  if (wrap) wrap.style.display = '';
}

  // Live from card 46408; fallback = single QTD dot from card 43909 (most accurate)
  const ssTodayI = Math.max(0, dIdx('May 29'));
  function mkSSDot(val, trackArr) {

  const ssQTDgl  = MB43909_SS?.gl  ?? 100;

function buildCravenCherriesAggregates() {
  const CC_VOL = _isQ3 ? 1435000 : 550000, CC_GL = _isQ3 ? 279 : 165, n = QUARTER_LEN;
  const volTrack = Array.from({length:n}, (_, i) => ({ x: i, y: CC_VOL * (i+1) / n }));
  const glTrack  = Array.from({length:n}, (_, i) => ({ x: i, y: CC_GL  * (i+1) / n }));
  const flatTarget2k = Array.from({length:n}, (_, i) => ({ x: i, y: _isQ3?2650:2000 }));
  // Aggregate CC_LIVE_DATA (per-rep cumulative) into relative daily deltas for the current quarter
  const byDayVol = {}, byDayGL = {};
  for (const repDays of Object.values(CC_LIVE_DATA || {})) {
    if (_isQ3) {
      // Find Q2 end baseline for this rep (last cumulative value on or before Q2_END_IDX)
      const q2End = [...repDays].filter(d => d.x <= Q2_END_IDX).sort((a,b) => b.x-a.x)[0];
      const q2VolBase = q2End?.cumVol || 0, q2GLBase = q2End?.cumGL || 0;
      const q3Days = repDays.filter(d => d.x >= Q3_START_IDX).sort((a,b) => a.x-b.x);
      for (let i = 0; i < q3Days.length; i++) {
        const d = q3Days[i], prev = q3Days[i-1];
        const xRel = d.x - Q3_START_IDX;
        byDayVol[xRel] = (byDayVol[xRel]||0) + ((d.cumVol||0) - (prev?.cumVol ?? q2VolBase));
        byDayGL[xRel]  = (byDayGL[xRel]||0)  + ((d.cumGL||0)  - (prev?.cumGL  ?? q2GLBase));
      }
    } else {
      const q2Days = repDays.filter(d => d.x < Q3_START_IDX).sort((a,b) => a.x-b.x);
      for (let i = 0; i < q2Days.length; i++) {
        const d = q2Days[i], prev = q2Days[i-1];
        byDayVol[d.x] = (byDayVol[d.x]||0) + ((d.cumVol||0) - (prev?.cumVol||0));
        byDayGL[d.x]  = (byDayGL[d.x]||0)  + ((d.cumGL||0)  - (prev?.cumGL||0));
      }
    }
  }
  let cumVol = 0, cumGL = 0;
  const volDots = [], glDots = [], avgDots = [];
  const keysArr = Object.keys(byDayVol).map(Number);
  const maxI = keysArr.length ? Math.max(...keysArr.concat(_qRelX)) : _qRelX;
  for (let i = 0; i <= maxI; i++) {
    if (byDayVol[i] !== undefined || byDayGL[i] !== undefined) {
      cumVol += byDayVol[i] || 0; cumGL += byDayGL[i] || 0;
      const vt = volTrack[i]?.y || 0, gt = glTrack[i]?.y || 0;
      const vp = vt > 0 ? cumVol/vt : null, gp = gt > 0 ? cumGL/gt : null;
      const isTod = i === _qRelX;
      volDots.push({ x:i, y:cumVol, pacing:vp, color:pacingColorBright(vp), today:isTod });
      glDots.push({ x:i, y:cumGL, pacing:gp, color:pacingColorBright(gp), today:isTod });
      if (cumGL > 0) { const av=cumVol/cumGL, _at=_isQ3?2650:2000; avgDots.push({ x:i, y:av, pacing:av/_at, color:pacingColorBright(av/_at), today:isTod }); }
    }
  }
  // Extend to today if last dot is before today (using relative _qRelX)
  const extendTo = (dots, trackArr) => {
    if (dots.length && dots[dots.length-1].x < _qRelX) {
      const ld=dots[dots.length-1], tr=trackArr[_qRelX]?.y||0, p=tr>0?ld.y/tr:null;
      dots.push({x:_qRelX,y:ld.y,pacing:p,color:pacingColorBright(p),today:true});
    }
  };
  extendTo(volDots, volTrack); extendTo(glDots, glTrack);
  if (avgDots.length && avgDots[avgDots.length-1].x < _qRelX) { const la=avgDots[avgDots.length-1], _at3=_isQ3?2650:2000; avgDots.push({x:_qRelX,y:la.y,pacing:la.y/_at3,color:pacingColorBright(la.y/_at3),today:true}); }
  // Use first-30 per-practice avg when available; convert absolute x to relative
  const _rawCcAvg = CC_AVG_DOTS ? CC_AVG_DOTS.filter(d => _isQ3 ? d.x >= Q3_START_IDX : d.x < Q3_START_IDX).map(d => ({...d, x: _isQ3 ? d.x - Q3_START_IDX : d.x})) : null;
  const _ccAvgDots = _rawCcAvg || avgDots;
  return { volTrack, glTrack, flatTarget2k, volTarget: CC_VOL, glTarget: CC_GL, volDots, glDots, avgDots: _ccAvgDots };
}

const ALL_SECTIONS = [...repNames, 'specSquad', 'cravenCherries', 'clinMed'];

function _lockScroll(fn) { fn(); }
function clearActive() {
  ALL_SECTIONS.forEach(k => {

  });
}

function _animBars(cardEl) {
  if (!cardEl) return;
  cardEl.querySelectorAll('.bar-fill').forEach(el => { el.classList.remove('bar-anim'); void el.offsetWidth; el.classList.add('bar-anim'); });
}
function selectRep(rep) {
  clearActive();

  const _card = document.getElementById('card-' + rep);

  buildRepSection(rep);
  const sec = document.getElementById('section-' + rep);
  sec.style.display = '';

    sec.classList.add('rep-active');
    // Replay chart animations every visit
    [rep + '_vol', rep + '_gl', rep + '_avg', 'chart-' + rep + '-ote'].forEach(k => {
      const ch = chartInstances[k]; if (ch) { ch.reset(); ch.update(); }
    });
  }));

}

  const isCC = Object.values(CC_AE_MAP).includes(rep);

function _doInit(){
  document.getElementById('loadingMsg')?.remove();

  const _qlDI = document.getElementById('quarterLabel');
  if (_qlDI) _qlDI.textContent = _qLabel + ' · Performance Dashboard';

  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e) {} });

  document.getElementById('repDetail').innerHTML='';

  {const _t=_returnTab||null;_returnTab=null;if(_t==='specSquad')selectSpecSquad();else if(_t==='cravenCherries')selectCravenCherries();else if(_t==='clinMed')selectClinMed();else if(_t&&sortedReps.includes(_t))selectRep(_t);else selectClinMed();}

  setTimeout(buildTeamRankChart, 100);

}
setTimeout(()=>{if(!document.getElementById('teamGrid')?.children?.length)_doInit();},8000);

// ── Keyboard shortcuts ────────────────────────────────────────────
(function() {
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.metaKey || e.ctrlKey) return;
    const allTabs = [...sortedReps, 'specSquad', 'clinMed'];
    const activeEl = document.querySelector('.tab-btn.active');
    const activeId = activeEl?.id?.replace('tab-','');
    const idx = allTabs.indexOf(activeId);
    const go = key => key === 'specSquad' ? selectSpecSquad() : key === 'cravenCherries' ? selectCravenCherries() : key === 'clinMed' ? selectClinMed() : selectRep(key);

    if (e.key === 'ArrowRight') { e.preventDefault(); go(allTabs[(idx+1) % allTabs.length]); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(allTabs[(idx-1+allTabs.length) % allTabs.length]); }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); selectRep(sortedReps[0]); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); selectClinMed(); }
    else if (e.key === 'R') { doRefresh(); }
    else if (e.key >= '1' && e.key <= '9') { const i=parseInt(e.key)-1; if(i<sortedReps.length) selectRep(sortedReps[i]); }

  });
})();
</script>

<script>
// ── Auto-refresh every 5 minutes ──────────────────────────────────
function doRefresh() {
  _returnTab = document.querySelector('.tab-btn.active')?.id?.replace('tab-','') || null;
  // Don't blank the DOM before fetch — avoids visible flash. _doInit() clears & rebuilds on completion.
  fetchLiveData();
}

// Auto-refresh live panels (today vol/GL, recent tx, recent go lives) every 5 minutes
// This keeps the Recent tab and Today column current without a full page reload
function _refreshLivePanels() {
  const P = window.location.origin, t = Date.now();
  Promise.all([fetchGet(P+'/data/todayvol?t='+t,15000),fetchGet(P+'/data/todaygl?t='+t,15000)])
    .then(([dVol,dGL])=>{
      const td={};
      (dVol?.data?.rows||[]).forEach(r=>{const k=REP_AE_MAP[r[0]]||CC_AE_MAP[r[0]];if(k){if(!td[k])td[k]={vol:0,gl:0};td[k].vol=r[1]||0;}});
      (dGL?.data?.rows||[]).forEach(r=>{const k=REP_AE_MAP[r[0]]||CC_AE_MAP[r[0]];if(k){if(!td[k])td[k]={vol:0,gl:0};td[k].gl=r[1]||0;}});
      TODAY_LIVE_DATA=td;
      window._lastRefreshTs = Date.now();
      try{buildDailySnapshot();}catch(e){}
      try{refreshCMTile();}catch(e){}
      try{
        const _s=document.querySelector('.tab-btn.active')?.id;
        sortedReps=[...repNames].sort((a,b)=>repAvgPacing(b)-repAvgPacing(a));
        const g=document.getElementById('teamGrid');if(g){g.innerHTML='';buildTeamGrid();}
        const tb=document.getElementById('repTabs');if(tb){tb.innerHTML='';buildTabs();}
        if(_s){const b=document.getElementById(_s);if(b)b.click();}
      }catch(e){}
    }).catch(()=>{});
  fetchGet(P+'/data/recent?t='+t,20000).then(r=>{if(!r?.data?.rows)return;RECENT_TX_DATA=r.data.rows;renderRecentTx();}).catch(()=>{});
  fetchGet(P+'/data/recentgl?t='+t,20000).then(r=>{if(!r?.data?.rows)return;RECENT_GL_DATA=r.data.rows;renderRecentGL();}).catch(()=>{});
  fetchGet(P+'/data/checkouts?t='+t,30000).then(r=>{if(!r?.data?.rows)return;CHECKOUTS_DATA=r.data.rows;renderCheckouts();}).catch(()=>{});
  fetchGet(P+'/data/approvals?t='+t,30000).then(r=>{if(!r?.data?.rows)return;APPROVALS_DATA=r.data.rows;renderApprovals();}).catch(()=>{});
}
setInterval(_refreshLivePanels, 5*60*1000);

}, 10 * 60 * 1000);
</script>
